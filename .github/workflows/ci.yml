name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build production image
        run: docker build --tag offerminator:ci .

      - name: Smoke test production image
        run: |
          set -euo pipefail

          docker run --detach --name offerminator-ci --publish 10000:10000 offerminator:ci

          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              docker logs offerminator-ci || true
            fi
            docker rm --force offerminator-ci >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --connect-timeout 1 --max-time 2 http://127.0.0.1:10000/api/health > /tmp/offerminator-health.json; then
              break
            fi
            sleep 1
          done

          grep --fixed-strings --quiet '{"status":"ok"}' /tmp/offerminator-health.json
          curl --fail --silent http://127.0.0.1:10000/ > /tmp/offerminator-index.html
          grep --fixed-strings --quiet '<div id="root"></div>' /tmp/offerminator-index.html
